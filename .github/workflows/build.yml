name: Build Gurke Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Gurke Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Gurke-Client-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
