directories:
  output: dist
  buildResources: build
appId: de.gurke.client
productName: Gurke Client
artifactName: Gurke-Client-${version}-${os}-${arch}.${ext}
files:
  - filter:
      - '**/*'
      - '!dist/**/*'
      - '!node_modules/.cache/**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Game
  executableName: gurke-client
  icon: build/icons
  syncDesktopName: true
mac:
  target: dmg
electronVersion: 31.7.7
